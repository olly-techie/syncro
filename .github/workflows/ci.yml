name: ci
on:
  push:
  pull_request:
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: make check
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './bin ./lib'
          severity: warning
      - name: Mock tests (no device)
        run: make test
